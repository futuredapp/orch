# Release pipeline (R5, R6, R7, R13, R14, R11a, R15, AE2): on a `v*` tag, verify
# the changelog, build + smoke a binary on each native OS, publish a Release with
# the three binaries + SHA256SUMS, then bump the homebrew-orch tap formula AND
# deploy the docs site. Docs deploy ONLY here (gated on publish), never on a
# push to main — so the live site never describes a version that didn't ship.
#
# Topology: fan-out build (one job per OS, contents:read) → fan-in publish (the
# only contents:write job) → bump-formula (no GITHUB_TOKEN write; authenticates
# to the tap with a step-scoped fine-grained PAT) ‖ deploy-docs (Pages, gated on
# publish, parallel to bump-formula).
name: Release

on:
  push:
    tags: ['v*']

# Default to read-only; jobs widen explicitly where required.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Gate the whole pipeline on a finalised CHANGELOG entry for this tag.
  changelog-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Assert CHANGELOG has a non-stub entry for the tag
        run: bun scripts/changelog-section.ts --version "${GITHUB_REF_NAME#v}"

  # 2. Full check suite — the SAME reusable gate PRs pass (shared check.yml), so
  #    a tag can never trip a level the PR job quietly accommodated. Previously a
  #    hand-copied job here drifted: it lacked the modern-tmux build, the git
  #    identity, and ORCH_DISABLE_REAL_TMUX, so the real-tmux/real-git levels that
  #    pass on PRs failed on the tag.
  check:
    uses: ./.github/workflows/check.yml

  # 3. Build + smoke each platform's binary on its OWN native OS. A
  #    cross-compiled binary that is never executed is unverified (Decision 2).
  build:
    needs: [changelog-gate, check]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is arm64; Intel needs the explicit -intel label (being
          # retired Fall 2027 — confirm the live label at release time).
          - os: macos-15
            target: bun-darwin-arm64
            asset: orch-darwin-arm64
          - os: macos-15-intel
            target: bun-darwin-x64
            asset: orch-darwin-x64
          - os: ubuntu-24.04
            target: bun-linux-x64
            asset: orch-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build ${{ matrix.asset }}
        run: bun run build:binary --target ${{ matrix.target }} --outfile dist/${{ matrix.asset }}

      # The gate that closes the cross-target carry-over (R7) and guards the
      # built-in embed (R-3): runs init+run AND a built-in load with Bun scrubbed
      # from PATH, and FAILS if bun still resolves.
      - name: Smoke ${{ matrix.asset }} (no Bun on PATH)
        run: bash scripts/smoke-binary.sh dist/${{ matrix.asset }}

      - name: Checksum ${{ matrix.asset }}
        working-directory: dist
        run: shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  # 4. Assemble SHA256SUMS and publish ONE Release. Only this job can write
  #    repo contents. Idempotent on re-run (updates an existing Release).
  publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Assemble SHA256SUMS
        working-directory: dist
        run: |
          cat ./*.sha256 > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Extract release notes from CHANGELOG
        run: bun scripts/changelog-section.ts --version "${TAG#v}" --extract > notes.md

      - name: Create or update the Release (idempotent)
        run: |
          assets=(dist/orch-darwin-arm64 dist/orch-darwin-x64 dist/orch-linux-x64 dist/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — updating (re-run)."
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --title "$TAG" --notes-file notes.md
          fi

  # 5. Bump the homebrew-orch formula. Holds NO GITHUB_TOKEN write scope; it
  #    authenticates to the tap only via the step-scoped fine-grained PAT, and
  #    sources the checksums from the PUBLISHED Release bytes (not the build
  #    artifacts) so a tampered intermediate artifact can't poison the formula.
  bump-formula:
    needs: publish
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # orch checkout — provides scripts/bump-formula.ts.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # Tap checkout — the ONLY place the PAT is referenced (step scope). The
      # token is also what `git push` below authenticates with.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: futuredapp/homebrew-orch
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Download released binaries and recompute checksums
        run: |
          mkdir -p dist
          base="https://github.com/futuredapp/orch/releases/download/$TAG"
          for asset in orch-darwin-arm64 orch-darwin-x64 orch-linux-x64; do
            curl -fsSL "$base/$asset" -o "dist/$asset"
          done
          (cd dist && shasum -a 256 orch-darwin-arm64 orch-darwin-x64 orch-linux-x64 > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Bump the formula
        run: bun scripts/bump-formula.ts --version "${TAG#v}" --dist dist --formula tap/Formula/orch.rb

      - name: Commit and push the formula bump
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Formula already up to date for $TAG — nothing to push."
          else
            git commit -am "orch $TAG"
            git push
          fi

  # 6. Build + deploy the VitePress docs to GitHub Pages — but ONLY after the
  #    Release is published (needs: publish), so docs never describe a version
  #    that didn't ship. Runs in parallel with bump-formula. This is the ONLY
  #    place the docs site deploys: there is no push-to-main docs workflow.
  #    The deploy originates from the `v*` tag ref, so the `github-pages`
  #    environment's deployment-branch policy must allow the `v*` tag (see
  #    docs/release-setup-guide.md B9) — a one-time repo-admin setting.
  deploy-docs:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    # Serialize Pages deploys so one is never cancelled mid-flight.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 so VitePress `lastUpdated` can read git history.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Also the dead-link gate; a broken build fails before anything deploys.
      - name: Build docs
        run: bun run docs:build

      # The site root is docs/public, so the build output is UNDER it:
      # docs/public/.vitepress/dist (not docs/.vitepress/dist).
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/public/.vitepress/dist

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
