# PR gate (R11, R11a, AE3): every pull request must pass the full check suite,
# the docs build, conventional-commit linting, and the action-pin audit.
#
# SECURITY — this workflow runs untrusted fork-PR code. It MUST NOT reference any
# `secrets.*`. On a public repo the `pull_request` event hands fork PRs a
# read-only GITHUB_TOKEN with no secret access, which is exactly what we want.
# Do NOT "fix" a perceived missing secret by switching to `pull_request_target`:
# that runs with the base repo's secrets in scope while checking out
# attacker-controlled code, a well-known supply-chain attack vector. If a check
# ever genuinely needs a secret, isolate it in a separate `pull_request_target`
# job that does NOT check out fork code.
name: PR

on:
  pull_request:
    branches: [develop, main]

# Least privilege: the gate only reads the code. No write scope, no secrets.
permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 so commitlint can see the full PR commit range.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Every third-party/first-party action must be SHA-pinned (R11a). A mutable
      # @v4 / @main ref fails here before anything else runs.
      - name: Audit action pins
        run: bun run check:actions

      # The gate: lint + typecheck + unit + mocked-integration tests. RUN_REAL_*
      # is deliberately never set (AE3) — no real Claude/Codex/tmux runs on PRs.
      - name: Run checks
        run: bun run check

      - name: Build docs (dead-link gate)
        run: bun run docs:build

      - name: Lint commit messages
        run: >-
          bunx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
