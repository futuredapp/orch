# PR gate (R11, R11a, AE3): every pull request must pass the full check suite,
# the docs build, and conventional-commit linting.
#
# The check suite itself lives in the reusable check.yml (shared with release.yml
# so the two can never drift). This workflow adds the two PR-only gates on top:
# the docs dead-link build and commit-message linting.
#
# SECURITY — this workflow runs untrusted fork-PR code. It MUST NOT reference any
# `secrets.*`, and it passes none to the reusable check workflow. On a public repo
# the `pull_request` event hands fork PRs a read-only GITHUB_TOKEN with no secret
# access, which is exactly what we want. Do NOT "fix" a perceived missing secret
# by switching to `pull_request_target`: that runs with the base repo's secrets in
# scope while checking out attacker-controlled code, a well-known supply-chain
# attack vector. If a check ever genuinely needs a secret, isolate it in a
# separate `pull_request_target` job that does NOT check out fork code.
name: PR

on:
  pull_request:
    branches: [develop, main]

# Least privilege: the gate only reads the code. No write scope, no secrets.
permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The full check suite — identical to the gate release.yml runs on a tag.
  check:
    uses: ./.github/workflows/check.yml

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build docs (dead-link gate)
        run: bun run docs:build

  commitlint:
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 so commitlint can see the full PR commit range.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint commit messages
        run: >-
          bunx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
