# Docs deploy (R15, R11a): build the VitePress site and publish it to GitHub
# Pages on every push to main. Pages source must be set to "GitHub Actions" in
# repo settings (operator step, see docs/release-setup-guide.md).
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deploy needs page-write + an OIDC token; everything else is read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight Pages deploy — serialize them instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 so VitePress `lastUpdated` can read git history.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build docs
        run: bun run docs:build

      # The site root is docs/public, so the build output is UNDER it:
      # docs/public/.vitepress/dist (not docs/.vitepress/dist).
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/public/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
